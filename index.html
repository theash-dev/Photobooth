<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Whimsy Booth 🎀</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  font-family:"DM Sans",sans-serif;
  background:
    radial-gradient(circle at top left,#ffe5f0,transparent 35%),
    radial-gradient(circle at bottom right,#e9ddff,transparent 35%),
    #fff8fb;
  color:#493b45;
}

button,
input,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  width:min(1450px,96%);
  margin:auto;
  padding:22px;
}

header{
  text-align:center;
  margin-bottom:20px;
}

header h1{
  margin:0;
  font-family:"Playfair Display",serif;
  font-size:clamp(32px,5vw,58px);
  color:#6d5263;
}

header p{
  margin:5px 0 0;
  color:#a47d91;
}

.layout{
  display:grid;
  grid-template-columns:370px 1fr;
  gap:20px;
}

.panel,
.editor-card{
  background:rgba(255,255,255,.84);
  border:1px solid #f0dce6;
  border-radius:28px;
  box-shadow:0 15px 45px rgba(110,75,95,.10);
  backdrop-filter:blur(12px);
}

.panel{
  padding:18px;
  max-height:calc(100vh - 150px);
  overflow:auto;
}

.section{
  margin-bottom:18px;
  padding-bottom:17px;
  border-bottom:1px solid #f2e4eb;
}

.section:last-child{
  border-bottom:0;
}

.section-title{
  font-weight:700;
  margin-bottom:10px;
  color:#76586a;
}

.camera{
  position:relative;
  overflow:hidden;
  border-radius:22px;
  background:#241f22;
  aspect-ratio:4/3;
}

video{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

video.mirror{
  transform:scaleX(-1);
}

.camera-flash{
  position:absolute;
  inset:0;
  background:white;
  opacity:0;
  pointer-events:none;
}

.camera-flash.active{
  animation:flash .25s ease;
}

@keyframes flash{
  0%{opacity:.95}
  100%{opacity:0}
}

.countdown{
  position:absolute;
  inset:0;
  display:grid;
  place-items:center;
  color:white;
  font-size:90px;
  font-weight:700;
  text-shadow:0 4px 20px #0008;
  pointer-events:none;
}

.controls{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:10px;
}

.btn{
  border:0;
  border-radius:14px;
  padding:10px 12px;
  background:#f6e6ee;
  color:#694f5f;
  font-weight:600;
  transition:.18s;
}

.btn:hover{
  transform:translateY(-2px);
  background:#eed5e1;
}

.btn.primary{
  background:#c989a7;
  color:white;
}

.btn.dark{
  background:#695260;
  color:white;
}

.btn.danger{
  background:#f5d9df;
  color:#8d5361;
}

.btn.full{
  grid-column:1/-1;
}

label{
  display:block;
  font-size:12px;
  font-weight:700;
  margin:9px 0 5px;
  color:#866b79;
}

input[type="text"],
input[type="number"],
select{
  width:100%;
  border:1px solid #ead8e1;
  background:#fff;
  border-radius:11px;
  padding:8px 10px;
  color:#5c4954;
  outline:none;
}

input[type="color"]{
  width:100%;
  height:38px;
  border:1px solid #ead8e1;
  border-radius:11px;
  background:white;
  padding:3px;
}

input[type="range"]{
  width:100%;
  accent-color:#bd7f9e;
}

.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.triple{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:7px;
}

.chips{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
}

.chip{
  border:1px solid #ead6df;
  background:#fff;
  color:#775c6b;
  padding:7px 9px;
  border-radius:12px;
  font-size:12px;
  font-weight:600;
}

.chip.active{
  background:#efd5e1;
  border-color:#d69ab4;
}

.stickers{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:7px;
}

.sticker-btn{
  border:1px solid #eadbe2;
  background:#fffafd;
  border-radius:14px;
  height:52px;
  font-size:25px;
}

.sticker-btn:hover{
  background:#fbeaf1;
  transform:scale(1.04);
}

.template-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.template{
  border:1px solid #eadbe2;
  background:#fff;
  border-radius:15px;
  padding:10px 7px;
  color:#6e5262;
  font-weight:700;
  font-size:12px;
}

.template span{
  display:block;
  font-size:23px;
  margin-bottom:3px;
}

.editor-card{
  padding:18px;
  min-width:0;
}

.editor-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:12px;
}

.editor-top h2{
  margin:0;
  font-family:"Playfair Display",serif;
  color:#6d5263;
}

.editor-tools{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
}

.editor-wrap{
  min-height:720px;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:auto;
  border-radius:24px;
  background:
    linear-gradient(45deg,#f6eef2 25%,transparent 25%),
    linear-gradient(-45deg,#f6eef2 25%,transparent 25%),
    linear-gradient(45deg,transparent 75%,#f6eef2 75%),
    linear-gradient(-45deg,transparent 75%,#f6eef2 75%);
  background-size:28px 28px;
  background-position:0 0,0 14px,14px -14px,-14px 0;
  padding:35px;
}

#canvas{
  position:relative;
  width:480px;
  height:720px;
  flex:none;
  overflow:hidden;
  box-shadow:0 15px 45px rgba(60,40,50,.22);
  transform-origin:center;
}

.element{
  position:absolute;
  user-select:none;
  touch-action:none;
  cursor:move;
}

.element.selected{
  outline:2px dashed #bd7f9e;
  outline-offset:3px;
}

.photo-element{
  object-fit:cover;
  border-style:solid;
  display:block;
}

.text-element{
  white-space:nowrap;
  font-weight:700;
  color:#59424f;
}

.sticker-element{
  font-size:55px;
  line-height:1;
}

.handle{
  position:absolute;
  width:13px;
  height:13px;
  border-radius:50%;
  background:#bd7f9e;
  border:2px solid white;
  box-shadow:0 2px 5px #0002;
}

.handle.resize{
  right:-8px;
  bottom:-8px;
  cursor:nwse-resize;
}

.handle.rotate{
  left:50%;
  top:-28px;
  transform:translateX(-50%);
  cursor:grab;
}

.selection-toolbar{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  margin-top:12px;
}

.selection-toolbar button{
  border:1px solid #ead8e1;
  background:white;
  border-radius:10px;
  padding:7px 9px;
  font-size:12px;
}

.empty{
  position:absolute;
  inset:0;
  display:grid;
  place-items:center;
  text-align:center;
  color:#b696a7;
  pointer-events:none;
  padding:40px;
}

.empty strong{
  display:block;
  color:#886a79;
  font-size:20px;
  margin-bottom:5px;
}

.toast{
  position:fixed;
  left:50%;
  bottom:25px;
  transform:translateX(-50%) translateY(20px);
  background:#604b58;
  color:white;
  padding:11px 17px;
  border-radius:999px;
  opacity:0;
  pointer-events:none;
  transition:.25s;
  z-index:1000;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

@media(max-width:1000px){
  .layout{
    grid-template-columns:1fr;
  }

  .panel{
    max-height:none;
  }

  .editor-wrap{
    min-height:600px;
  }
}

@media(max-width:600px){
  .app{
    width:100%;
    padding:10px;
  }

  .panel,
  .editor-card{
    border-radius:20px;
  }

  .editor-wrap{
    padding:20px;
    min-height:520px;
  }

  #canvas{
    transform:scale(.72);
  }

  .triple{
    grid-template-columns:1fr 1fr;
  }
}
</style>
</head>

<body>

<div class="app">

<header>
  <h1>Whimsy Booth 🎀</h1>
  <p>your tiny dreamy photobooth ♡</p>
</header>

<div class="layout">

<!-- ================= CAMERA / CONTROLS ================= -->

<aside class="panel">

<div class="section">

<div class="section-title">📸 Camera</div>

<div class="camera">
  <video id="video" autoplay playsinline></video>
  <div id="countdown" class="countdown"></div>
  <div id="flash" class="camera-flash"></div>
</div>

<div class="controls">
  <button class="btn primary" id="captureBtn">♡ Take Photos</button>
  <button class="btn" id="flipBtn">↔ Flip</button>
</div>

<div class="row">
  <div>
    <label>Photos</label>
    <select id="photoCount">
      <option value="3">3 Photos</option>
      <option value="4" selected>4 Photos</option>
    </select>
  </div>

  <div>
    <label>Countdown</label>
    <select id="countdownTime">
      <option value="0">Off</option>
      <option value="3" selected>3 sec</option>
      <option value="5">5 sec</option>
      <option value="10">10 sec</option>
    </select>
  </div>
</div>

</div>

<!-- ================= TEMPLATES ================= -->

<div class="section">

<div class="section-title">🎀 Templates</div>

<div class="template-grid">

<button class="template" onclick="applyTemplate('coquette')">
<span>🎀</span>Coquette
</button>

<button class="template" onclick="applyTemplate('kpop')">
<span>💗</span>K-pop
</button>

<button class="template" onclick="applyTemplate('y2k')">
<span>💿</span>Y2K
</button>

<button class="template" onclick="applyTemplate('korean')">
<span>🇰🇷</span>Korean
</button>

<button class="template" onclick="applyTemplate('vintage')">
<span>🎞️</span>Vintage
</button>

<button class="template" onclick="applyTemplate('minimal')">
<span>🤍</span>Minimal
</button>

<button class="template" onclick="applyTemplate('pink')">
<span>🩷</span>Pink Cute
</button>

<button class="template" onclick="applyTemplate('polaroid')">
<span>📸</span>Polaroid
</button>

</div>

</div>

<!-- ================= FILTERS ================= -->

<div class="section">

<div class="section-title">✨ Filters</div>

<div class="chips" id="filters">

<button class="chip active" data-filter="original">Original</button>
<button class="chip" data-filter="soft">Soft</button>
<button class="chip" data-filter="coquette">Coquette</button>
<button class="chip" data-filter="film">Film</button>
<button class="chip" data-filter="vintage">Vintage</button>
<button class="chip" data-filter="dreamy">Dreamy</button>
<button class="chip" data-filter="bw">B&W</button>
<button class="chip" data-filter="warm">Warm</button>

</div>

<label>Brightness</label>
<input id="brightness" type="range" min="50" max="150" value="100">

<label>Saturation</label>
<input id="saturation" type="range" min="0" max="180" value="100">

<label>Grain</label>
<input id="grain" type="range" min="0" max="30" value="0">

</div>

<!-- ================= FILMSTRIP ================= -->

<div class="section">

<div class="section-title">🎞️ Filmstrip</div>

<div class="row">

<div>
<label>Size</label>
<select id="stripSize">
<option value="portrait">4 × 6 Portrait</option>
<option value="long">2 × 6 Strip</option>
<option value="landscape">4 × 6 Landscape</option>
<option value="square">Square</option>
</select>
</div>

<div>
<label>Arrangement</label>
<select id="arrangement">
<option value="vertical">Vertical</option>
<option value="horizontal">Horizontal</option>
<option value="grid">2 × 2 Grid</option>
</select>
</div>

</div>

<label>Background</label>
<input id="bgColor" type="color" value="#fff7fa">

<label>Photo Border</label>
<input id="borderColor" type="color" value="#ffffff">

<div class="row">

<div>
<label>Border Width</label>
<input id="borderWidth" type="number" min="0" max="30" value="5">
</div>

<div>
<label>Corner Radius</label>
<input id="radius" type="number" min="0" max="80" value="12">
</div>

</div>

<label>Photo Spacing</label>
<input id="spacing" type="number" min="0" max="100" value="15">

</div>

<!-- ================= STICKERS ================= -->

<div class="section">

<div class="section-title">💗 Stickers</div>

<div class="stickers">

<button class="sticker-btn" onclick="addSticker('🎀')">🎀</button>
<button class="sticker-btn" onclick="addSticker('♡')">♡</button>
<button class="sticker-btn" onclick="addSticker('♥')">♥</button>
<button class="sticker-btn" onclick="addSticker('✿')">✿</button>
<button class="sticker-btn" onclick="addSticker('🌸')">🌸</button>
<button class="sticker-btn" onclick="addSticker('☆')">☆</button>
<button class="sticker-btn" onclick="addSticker('★')">★</button>
<button class="sticker-btn" onclick="addSticker('✨')">✨</button>
<button class="sticker-btn" onclick="addSticker('🦋')">🦋</button>
<button class="sticker-btn" onclick="addSticker('🎀')">🎀</button>
<button class="sticker-btn" onclick="addSticker('☁️')">☁️</button>
<button class="sticker-btn" onclick="addSticker('˚₊‧')">˚₊‧</button>

</div>

</div>

<!-- ================= TEXT ================= -->

<div class="section">

<div class="section-title">✍️ Text</div>

<label>Title</label>
<input id="titleInput" type="text" value="WHIMSY BOOTH">

<label>Caption</label>
<input id="captionInput" type="text" value="a little memory ♡">

<div class="row">
<div>
<label>Font</label>
<select id="fontSelect">
<option value="DM Sans">DM Sans</option>
<option value="Playfair Display">Playfair Display</option>
</select>
</div>

<div>
<label>Text Size</label>
<input id="textSize" type="number" value="24" min="8" max="100">
</div>
</div>

<label>Text Color</label>
<input id="textColor" type="color" value="#5d4652">

<div class="controls">
<button class="btn" onclick="addTitle()">+ Title</button>
<button class="btn" onclick="addCaption()">+ Caption</button>
<button class="btn" onclick="addDate()">+ Date</button>
</div>

</div>

<!-- ================= PRESETS ================= -->

<div class="section">

<div class="section-title">♡ Quick Presets</div>

<div class="chips">

<button class="chip" onclick="applyTemplate('coquette')">Coquette</button>
<button class="chip" onclick="applyTemplate('minimal')">Minimal</button>
<button class="chip" onclick="applyTemplate('pink')">Sweet</button>
<button class="chip" onclick="applyTemplate('vintage')">Film</button>

</div>

</div>

</aside>

<!-- ================= EDITOR ================= -->

<main class="editor-card">

<div class="editor-top">

<div>
<h2>Filmstrip Editor ✨</h2>
<small>Drag, resize and rotate anything ♡</small>
</div>

<div class="editor-tools">
<button class="btn" onclick="zoomOut()">−</button>
<button class="btn" id="zoomLabel">100%</button>
<button class="btn" onclick="zoomIn()">+</button>
<button class="btn" onclick="resetLayout()">Reset</button>
<button class="btn dark" onclick="downloadDesign()">Download PNG</button>
</div>

</div>

<div class="editor-wrap" id="editorWrap">

<div id="canvas">

<div class="empty" id="emptyMessage">
<div>
<strong>Your filmstrip will appear here ♡</strong>
Take your photos or choose a template.
</div>
</div>

</div>

</div>

<div class="selection-toolbar">

<button onclick="duplicateSelected()">Duplicate</button>
<button onclick="bringForward()">Bring Forward</button>
<button onclick="sendBackward()">Send Backward</button>
<button onclick="deleteSelected()">Delete</button>

</div>

</main>

</div>

</div>

<div class="toast" id="toast"></div>

<script>

/* =========================================================
   STATE
========================================================= */

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const emptyMessage = document.getElementById("emptyMessage");
const flash = document.getElementById("flash");
const countdownDisplay = document.getElementById("countdown");

let stream = null;
let facingMode = "user";
let capturedPhotos = [];
let selectedElement = null;
let elementId = 0;
let zoom = 1;

let settings = {
  filter:"original",
  brightness:100,
  saturation:100,
  grain:0,
  bg:"#fff7fa",
  border:"#ffffff",
  borderWidth:5,
  radius:12,
  spacing:15,
  arrangement:"vertical"
};

const filters = {
  original:"none",
  soft:"brightness(1.05) saturate(.9) contrast(.95)",
  coquette:"brightness(1.05) saturate(.85) contrast(.95) sepia(.05)",
  film:"contrast(1.08) saturate(.9) sepia(.12)",
  vintage:"contrast(1.05) saturate(.75) sepia(.28)",
  dreamy:"brightness(1.1) saturate(.8) blur(.1px)",
  bw:"grayscale(1) contrast(1.08)",
  warm:"sepia(.18) saturate(1.15) brightness(1.03)"
};


/* =========================================================
   CAMERA
========================================================= */

async function startCamera(){

  try{

    if(stream){
      stream.getTracks().forEach(track=>track.stop());
    }

    stream = await navigator.mediaDevices.getUserMedia({
      video:{
        facingMode:facingMode,
        width:{ideal:1280},
        height:{ideal:720}
      },
      audio:false
    });

    video.srcObject = stream;

  }catch(error){

    alert(
      "Camera access could not be started. Please allow camera permission and reload the page."
    );

  }

}

startCamera();


document.getElementById("flipBtn").onclick = async()=>{

  facingMode = facingMode === "user" ? "environment" : "user";

  video.classList.toggle("mirror",facingMode==="user");

  await startCamera();

};


async function wait(ms){
  return new Promise(resolve=>setTimeout(resolve,ms));
}


async function runCountdown(seconds){

  if(seconds <= 0) return;

  for(let i=seconds;i>0;i--){

    countdownDisplay.textContent=i;

    await wait(1000);

  }

  countdownDisplay.textContent="";

}


async function captureSingle(){

  const temp = document.createElement("canvas");

  temp.width = video.videoWidth || 1280;
  temp.height = video.videoHeight || 720;

  const ctx = temp.getContext("2d");

  if(facingMode==="user"){
    ctx.translate(temp.width,0);
    ctx.scale(-1,1);
  }

  ctx.filter =
    filters[settings.filter] +
    ` brightness(${settings.brightness/100}) saturate(${settings.saturation/100})`;

  ctx.drawImage(video,0,0,temp.width,temp.height);

  const image = new Image();

  image.src = temp.toDataURL("image/jpeg",.92);

  await new Promise(resolve=>image.onload=resolve);

  capturedPhotos.push(image);

  flash.classList.remove("active");
  void flash.offsetWidth;
  flash.classList.add("active");

}


document.getElementById("captureBtn").onclick = async()=>{

  capturedPhotos=[];

  const count = Number(document.getElementById("photoCount").value);
  const seconds = Number(document.getElementById("countdownTime").value);

  for(let i=0;i<count;i++){

    await runCountdown(seconds);
    await captureSingle();

    if(i<count-1){
      await wait(700);
    }

  }

  buildPhotoLayout();

  toast("Photos captured ♡");

};


/* =========================================================
   FILTER CONTROLS
========================================================= */

document.querySelectorAll("[data-filter]").forEach(button=>{

  button.onclick=()=>{

    document.querySelectorAll("[data-filter]")
      .forEach(b=>b.classList.remove("active"));

    button.classList.add("active");

    settings.filter=button.dataset.filter;

  };

});


document.getElementById("brightness").oninput=e=>{
  settings.brightness=Number(e.target.value);
};

document.getElementById("saturation").oninput=e=>{
  settings.saturation=Number(e.target.value);
};

document.getElementById("grain").oninput=e=>{
  settings.grain=Number(e.target.value);
};


/* =========================================================
   FILMSTRIP SETTINGS
========================================================= */

document.getElementById("stripSize").onchange=changeCanvasSize;

document.getElementById("bgColor").oninput=e=>{
  settings.bg=e.target.value;
  canvas.style.background=settings.bg;
};

document.getElementById("borderColor").oninput=e=>{
  settings.border=e.target.value;
  updatePhotoStyles();
};

document.getElementById("borderWidth").oninput=e=>{
  settings.borderWidth=Number(e.target.value);
  updatePhotoStyles();
};

document.getElementById("radius").oninput=e=>{
  settings.radius=Number(e.target.value);
  updatePhotoStyles();
};

document.getElementById("spacing").oninput=e=>{
  settings.spacing=Number(e.target.value);
  buildPhotoLayout();
};

document.getElementById("arrangement").onchange=e=>{
  settings.arrangement=e.target.value;
  buildPhotoLayout();
};


function changeCanvasSize(){

  const value=document.getElementById("stripSize").value;

  if(value==="portrait"){
    canvas.style.width="480px";
    canvas.style.height="720px";
  }

  if(value==="long"){
    canvas.style.width="240px";
    canvas.style.height="720px";
  }

  if(value==="landscape"){
    canvas.style.width="720px";
    canvas.style.height="480px";
  }

  if(value==="square"){
    canvas.style.width="650px";
    canvas.style.height="650px";
  }

  buildPhotoLayout();

}


/* =========================================================
   PHOTO LAYOUT
========================================================= */

function buildPhotoLayout(){

  document.querySelectorAll(".photo-element").forEach(el=>el.remove());

  if(!capturedPhotos.length){

    emptyMessage.style.display="grid";
    return;

  }

  emptyMessage.style.display="none";

  const W=canvas.clientWidth;
  const H=canvas.clientHeight;
  const photos=capturedPhotos;

  let positions=[];

  if(settings.arrangement==="vertical"){

    const gap=settings.spacing;
    const totalGap=gap*(photos.length+1);
    const h=(H-totalGap)/photos.length;

    photos.forEach((_,i)=>{

      positions.push({
        x:gap,
        y:gap+i*(h+gap),
        w:W-gap*2,
        h:h
      });

    });

  }

  else if(settings.arrangement==="horizontal"){

    const gap=settings.spacing;
    const totalGap=gap*(photos.length+1);
    const w=(W-totalGap)/photos.length;

    photos.forEach((_,i)=>{

      positions.push({
        x:gap+i*(w+gap),
        y:gap,
        w:w,
        h:H-gap*2
      });

    });

  }

  else{

    const gap=settings.spacing;

    const cols=2;
    const rows=Math.ceil(photos.length/2);

    const w=(W-gap*(cols+1))/cols;
    const h=(H-gap*(rows+1))/rows;

    photos.forEach((_,i)=>{

      const col=i%2;
      const row=Math.floor(i/2);

      positions.push({
        x:gap+col*(w+gap),
        y:gap+row*(h+gap),
        w:w,
        h:h
      });

    });

  }


  photos.forEach((photo,i)=>{

    const img=document.createElement("img");

    img.src=photo.src;

    img.className="element photo-element";

    img.dataset.type="photo";

    img.dataset.id=++elementId;

    const p=positions[i];

    img.style.left=p.x+"px";
    img.style.top=p.y+"px";
    img.style.width=p.w+"px";
    img.style.height=p.h+"px";

    img.style.borderColor=settings.border;
    img.style.borderWidth=settings.borderWidth+"px";
    img.style.borderRadius=settings.radius+"px";

    img.style.filter=
      filters[settings.filter]+
      ` brightness(${settings.brightness/100}) saturate(${settings.saturation/100})`;

    addInteractions(img);

    canvas.appendChild(img);

  });

}


function updatePhotoStyles(){

  document.querySelectorAll(".photo-element").forEach(img=>{

    img.style.borderColor=settings.border;
    img.style.borderWidth=settings.borderWidth+"px";
    img.style.borderRadius=settings.radius+"px";

  });

}


/* =========================================================
   ELEMENT SYSTEM
========================================================= */

function addInteractions(el){

  el.addEventListener("pointerdown",startDrag);

  el.addEventListener("click",e=>{

    e.stopPropagation();

    selectElement(el);

  });

}


canvas.addEventListener("pointerdown",e=>{

  if(e.target===canvas){
    deselect();
  }

});


function selectElement(el){

  if(selectedElement){
    removeHandles(selectedElement);
  }

  selectedElement=el;

  el.classList.add("selected");

  addHandles(el);

}


function deselect(){

  if(selectedElement){

    removeHandles(selectedElement);
    selectedElement.classList.remove("selected");

  }

  selectedElement=null;

}


function addHandles(el){

  if(el.dataset.type==="photo" || el.dataset.type==="sticker"){

    const resize=document.createElement("div");
    resize.className="handle resize";

    const rotate=document.createElement("div");
    rotate.className="handle rotate";

    resize.addEventListener("pointerdown",startResize);
    rotate.addEventListener("pointerdown",startRotate);

    el.appendChild(resize);
    el.appendChild(rotate);

  }

}


function removeHandles(el){

  el.querySelectorAll(".handle").forEach(h=>h.remove());

}


/* =========================================================
   DRAGGING
========================================================= */

let dragData=null;

function startDrag(e){

  if(e.target.classList.contains("handle")) return;

  e.preventDefault();
  e.stopPropagation();

  selectElement(e.currentTarget);

  const el=e.currentTarget;

  dragData={
    el:el,
    startX:e.clientX,
    startY:e.clientY,
    left:parseFloat(el.style.left)||0,
    top:parseFloat(el.style.top)||0
  };

  el.setPointerCapture(e.pointerId);

  el.addEventListener("pointermove",dragMove);
  el.addEventListener("pointerup",dragEnd,{once:true});

}


function dragMove(e){

  if(!dragData) return;

  const dx=(e.clientX-dragData.startX)/zoom;
  const dy=(e.clientY-dragData.startY)/zoom;

  dragData.el.style.left=(dragData.left+dx)+"px";
  dragData.el.style.top=(dragData.top+dy)+"px";

}


function dragEnd(){

  if(!dragData) return;

  dragData.el.removeEventListener("pointermove",dragMove);

  dragData=null;

}


/* =========================================================
   RESIZE
========================================================= */

let resizeData=null;

function startResize(e){

  e.preventDefault();
  e.stopPropagation();

  const el=e.currentTarget.parentElement;

  selectElement(el);

  resizeData={
    el:el,
    startX:e.clientX,
    startY:e.clientY,
    width:parseFloat(el.style.width)||100,
    height:parseFloat(el.style.height)||100
  };

  window.addEventListener("pointermove",resizeMove);
  window.addEventListener("pointerup",resizeEnd,{once:true});

}


function resizeMove(e){

  if(!resizeData)return;

  const dx=(e.clientX-resizeData.startX)/zoom;
  const dy=(e.clientY-resizeData.startY)/zoom;

  resizeData.el.style.width=Math.max(20,resizeData.width+dx)+"px";
  resizeData.el.style.height=Math.max(20,resizeData.height+dy)+"px";

}


function resizeEnd(){

  window.removeEventListener("pointermove",resizeMove);
  resizeData=null;

}


/* =========================================================
   ROTATE
========================================================= */

let rotateData=null;

function startRotate(e){

  e.preventDefault();
  e.stopPropagation();

  const el=e.currentTarget.parentElement;

  const rect=el.getBoundingClientRect();

  const cx=rect.left+rect.width/2;
  const cy=rect.top+rect.height/2;

  const startAngle=Math.atan2(
    e.clientY-cy,
    e.clientX-cx
  )*180/Math.PI;

  const currentRotation=parseFloat(el.dataset.rotation||0);

  rotateData={
    el:el,
    cx:cx,
    cy:cy,
    startAngle:startAngle,
    currentRotation:currentRotation
  };

  window.addEventListener("pointermove",rotateMove);
  window.addEventListener("pointerup",rotateEnd,{once:true});

}


function rotateMove(e){

  if(!rotateData)return;

  const angle=Math.atan2(
    e.clientY-rotateData.cy,
    e.clientX-rotateData.cx
  )*180/Math.PI;

  const rotation=
    rotateData.currentRotation+
    angle-
    rotateData.startAngle;

  rotateData.el.dataset.rotation=rotation;

  rotateData.el.style.transform=
    `rotate(${rotation}deg)`;

}


function rotateEnd(){

  window.removeEventListener("pointermove",rotateMove);

}


/* =========================================================
   STICKERS
========================================================= */

function addSticker(symbol){

  const el=document.createElement("div");

  el.className="element sticker-element";
  el.dataset.type="sticker";
  el.dataset.id=++elementId;

  el.textContent=symbol;

  el.style.left=(canvas.clientWidth/2-30)+"px";
  el.style.top=(canvas.clientHeight/2-30)+"px";
  el.style.width="70px";
  el.style.height="70px";

  addInteractions(el);

  canvas.appendChild(el);

  selectElement(el);

}


function addText(text){

  const el=document.createElement("div");

  el.className="element text-element";
  el.dataset.type="text";
  el.dataset.id=++elementId;

  el.textContent=text;

  el.style.left="50px";
  el.style.top="40px";
  el.style.fontFamily=document.getElementById("fontSelect").value;
  el.style.fontSize=document.getElementById("textSize").value+"px";
  el.style.color=document.getElementById("textColor").value;

  addInteractions(el);

  canvas.appendChild(el);

  selectElement(el);

}


function addTitle(){

  addText(document.getElementById("titleInput").value || "WHIMSY BOOTH");

}


function addCaption(){

  addText(document.getElementById("captionInput").value || "a little memory ♡");

}


function addDate(){

  addText(
    new Date().toLocaleDateString(
      undefined,
      {
        year:"numeric",
        month:"short",
        day:"numeric"
      }
    )
  );

}


/* =========================================================
   SELECTION ACTIONS
========================================================= */

function deleteSelected(){

  if(!selectedElement)return;

  selectedElement.remove();

  selectedElement=null;

}


function duplicateSelected(){

  if(!selectedElement)return;

  const clone=selectedElement.cloneNode(true);

  clone.dataset.id=++elementId;

  clone.style.left=
    (parseFloat(selectedElement.style.left)+20)+"px";

  clone.style.top=
    (parseFloat(selectedElement.style.top)+20)+"px";

  clone.classList.remove("selected");

  addInteractions(clone);

  canvas.appendChild(clone);

  selectElement(clone);

}


function bringForward(){

  if(!selectedElement)return;

  selectedElement.style.zIndex=
    (Number(selectedElement.style.zIndex)||1)+1;

}


function sendBackward(){

  if(!selectedElement)return;

  selectedElement.style.zIndex=
    Math.max(0,(Number(selectedElement.style.zIndex)||1)-1);

}


document.addEventListener("keydown",e=>{

  if(!selectedElement)return;

  const amount=e.shiftKey?10:2;

  if(e.key==="ArrowLeft")
    selectedElement.style.left=
      (parseFloat(selectedElement.style.left)-amount)+"px";

  if(e.key==="ArrowRight")
    selectedElement.style.left=
      (parseFloat(selectedElement.style.left)+amount)+"px";

  if(e.key==="ArrowUp")
    selectedElement.style.top=
      (parseFloat(selectedElement.style.top)-amount)+"px";

  if(e.key==="ArrowDown")
    selectedElement.style.top=
      (parseFloat(selectedElement.style.top)+amount)+"px";

  if(e.key==="Delete")
    deleteSelected();

});


/* =========================================================
   ZOOM
========================================================= */

function updateZoom(){

  canvas.style.transform=`scale(${zoom})`;

  document.getElementById("zoomLabel").textContent=
    Math.round(zoom*100)+"%";

}

function zoomIn(){

  zoom=Math.min(1.5,zoom+.1);
  updateZoom();

}

function zoomOut(){

  zoom=Math.max(.5,zoom-.1);
  updateZoom();

}

  document.getElementById("borderColor").value=t.border;
  document.getElementById("arrangement").value=t.arrangement;
  document.getElementById("spacing").value=t.spacing;

  document.getElementById("captionInput").value=t.caption;

  document.querySelectorAll("[data-filter]")
    .forEach(b=>{

      );

/* =========================================================
   DOWNLOAD
========================================================= */

async function downloadDesign(){

  const scale=2;

  const W=canvas.clientWidth;
  const H=canvas.clientHeight;

  const out=document.createElement("canvas");

  out.width=W*scale;
  out.height=H*scale;

  const ctx=out.getContext("2d");

  ctx.scale(scale,scale);

  ctx.fillStyle=settings.bg;
  ctx.fillRect(0,0,W,H);

  const elements=[
    ...canvas.querySelectorAll(".element")
  ].sort(
    (a,b)=>
      (Number(a.style.zIndex)||0)-
      (Number(b.style.zIndex)||0)
  );

  for(const el of elements){

    const x=parseFloat(el.style.left)||0;
    const y=parseFloat(el.style.top)||0;
    const w=parseFloat(el.style.width)||100;
    const h=parseFloat(el.style.height)||100;

    const rotation=parseFloat(el.dataset.rotation||0);

    ctx.save();

    ctx.translate(x+w/2,y+h/2);

    ctx.rotate(rotation*Math.PI/180);

    ctx.translate(-w/2,-h/2);

    if(el.dataset.type==="photo"){

      const img=new Image();

      img.src=el.src;

      await new Promise(resolve=>{

        if(img.complete) resolve();
        else img.onload=resolve;

      });

      ctx.filter=
        filters[settings.filter]+
        ` brightness(${settings.brightness/100}) saturate(${settings.saturation/100})`;

      roundRect(
        ctx,
        0,
        0,
        w,
        h,
        settings.radius
      );

      ctx.clip();

      ctx.drawImage(img,0,0,w,h);

      ctx.filter="none";

      if(settings.borderWidth>0){

        ctx.strokeStyle=settings.border;
        ctx.lineWidth=settings.borderWidth;

        roundRect(
          ctx,
          settings.borderWidth/2,
          settings.borderWidth/2,
          w-settings.borderWidth,
          h-settings.borderWidth,
          Math.max(0,settings.radius-settings.borderWidth)
        );

        ctx.stroke();

      }

    }

    else if(el.dataset.type==="text"){

      const style=getComputedStyle(el);

      ctx.font=
        `${style.fontWeight} ${style.fontSize} ${style.fontFamily}`;

      ctx.fillStyle=style.color;

      ctx.textBaseline="top";

      ctx.fillText(
        el.textContent,
        0,
        0
      );

    }

    else if(el.dataset.type==="sticker"){

      const style=getComputedStyle(el);

      ctx.font=
        `${Math.min(w,h)}px sans-serif`;

      ctx.textBaseline="top";

      ctx.fillText(
        el.textContent,
        0,
        0
      );

    }

    ctx.restore();

  }


  const link=document.createElement("a");

  link.download=
    "whimsy-booth-"+Date.now()+".png";

  link.href=out.toDataURL("image/png");

  link.click();

  toast("Your filmstrip is ready! 🎀");

}


function roundRect(ctx,x,y,w,h,r){

  r=Math.min(r,w/2,h/2);

  ctx.beginPath();

  ctx.moveTo(x+r,y);

  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);

  ctx.closePath();

}


/* =========================================================
   TOAST
========================================================= */

function toast(message){

  const el=document.getElementById("toast");

  el.textContent=message;

  el.classList.add("show");

  clearTimeout(window.toastTimer);

  window.toastTimer=setTimeout(
    ()=>el.classList.remove("show"),
    2200
  );

}
